# Run E-CFunds locally in Docker:  docker compose up --build   → http://localhost:8080
# The two VITE_ values are read from .env (copy .env.example to .env and fill them in).
# Database, sign-in and notifications are the online Supabase project — no local database service is needed.
services:
  web:
    image: e-cfunds:latest
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in .env}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
