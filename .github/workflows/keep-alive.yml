# Keeps the free Supabase project from pausing after 7 idle days (Phase 6, Neil 2026-11-13).
# Calls the anonymous public.keep_alive() function every 3 days. The publishable key is public by design;
# it is read from the repo variable SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions → Variables).
# GitHub only runs scheduled workflows from the default branch (main).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC (11:17 Manila) every 3rd day
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keep_alive
        env:
          URL: https://nvmlawpojydnouzqilaf.supabase.co/rest/v1/rpc/keep_alive
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Repo variable SUPABASE_PUBLISHABLE_KEY is not set"; exit 1; fi
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 -X POST "$URL" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -w '\n%{http_code}') || true
            code=$(echo "$body" | tail -n1); text=$(echo "$body" | head -n1)
            echo "attempt $attempt: HTTP $code $text"
            if [ "$code" = "200" ] && [ "$text" = '"ok"' ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Supabase did not answer the keep-alive ping"; exit 1
