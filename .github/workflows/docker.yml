# Docker Hub image, kept up to date automatically (Neil, 2026-11-17).
# Every push to main that changes the app builds the Dockerfile and uploads it to Docker Hub as:
#   ramosneil/e-cfunds:latest     — always the newest
#   ramosneil/e-cfunds:1.0.<run>  — a numbered version (1.0.1, 1.0.2, …; 1.0.0 was uploaded by hand)
# Needs the repo secret DOCKERHUB_TOKEN (Docker Hub personal access token, Read & Write) — see docs/docker.md.
# The public Supabase values are the same ones the Android build uses (repo variable SUPABASE_PUBLISHABLE_KEY).
name: Docker Hub image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'frontend/android/**'
      - 'backend/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/keep-alive.yml'
  workflow_dispatch:

concurrency:
  group: docker-hub
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ramosneil/e-cfunds
    steps:
      - uses: actions/checkout@v5

      - name: Check settings
        env:
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then echo "::error::Repo secret DOCKERHUB_TOKEN is not set (docs/docker.md)"; exit 1; fi
          if [ -z "$KEY" ]; then echo "::error::Repo variable SUPABASE_PUBLISHABLE_KEY is not set"; exit 1; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ramosneil
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VITE_SUPABASE_URL=https://nvmlawpojydnouzqilaf.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:1.0.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the uploaded image starts
        run: |
          docker run -d --rm --name ecf -p 8080:8080 "$IMAGE:1.0.${{ github.run_number }}"
          for i in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "<title>E-CFunds</title>"
          docker stop ecf
          echo "### Docker Hub: \`$IMAGE:latest\` and \`$IMAGE:1.0.${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
