# Same behaviour as vercel.json: app routes fall back to index.html, security headers, caching rules.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Built files have a hash in their name: cache them for a year.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Always check these for a newer version.
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Files (with an extension) must exist; everything else is an app page (/members, /receipt/SSG-2026-0001…).
    location ~ \.[a-zA-Z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri /index.html;
    }
}
