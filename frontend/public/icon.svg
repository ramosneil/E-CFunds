<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- E-CFunds app icon (Neil's logo sheet, 2026-11-24): a gold ₱ coin on the OMSU-navy tile.
       Full-bleed square so it also works as a maskable/adaptive icon; the coin stays inside the central safe zone.
       make-app-assets.mjs splits it: the full-size rectangle = background, the group after it = foreground. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3FA0"/>
      <stop offset="1" stop-color="#283891"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none">
    <!-- the coin and its rim -->
    <circle cx="256" cy="256" r="152" fill="#FDD20A"/>
    <circle cx="256" cy="256" r="134" stroke="#E2B600" stroke-width="6" opacity=".75"/>
    <!-- ₱: stem + bowl of the P -->
    <path d="M228 348 V176 H274 a50 50 0 0 1 0 100 H228" stroke="#283891" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the two bars that make P into ₱ -->
    <rect x="188" y="204" width="142" height="13" rx="6.5" fill="#283891"/>
    <rect x="188" y="232" width="142" height="13" rx="6.5" fill="#283891"/>
  </g>
</svg>
