<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 580" role="img" aria-label="Sequence for recording a payment: the app calls record_payment; PostgreSQL checks the org, marks the dues paid, adds a collection and a receipt; the receipt returns to the treasurer; then, asynchronously, pg_net calls the push function which sends through Firebase to the student's phone, and a Realtime live tick makes the SAS dashboard refetch." xmlns="http://www.w3.org/2000/svg" width="1140" height="580">
