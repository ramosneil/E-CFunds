<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 590" role="img" aria-label="Five layers from top to bottom: presentation pages per role; client logic in the browser or app; the Supabase API gateway; business logic as private functions and triggers inside PostgreSQL; and data tables with Row Level Security plus storage buckets." xmlns="http://www.w3.org/2000/svg" width="1000" height="590">
