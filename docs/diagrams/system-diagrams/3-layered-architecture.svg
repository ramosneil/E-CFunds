      <text x="230" y="158" fill="rgb(86, 96, 126)" fill-opacity="1" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" stroke-opacity="1" opacity="1" font-size="11.5px" font-weight="400" font-family="Inter, Arial, Helvetica, sans-serif">React Query cache · sign-in and role routing · live refresh (Realtime, 30 s backup)</text>
