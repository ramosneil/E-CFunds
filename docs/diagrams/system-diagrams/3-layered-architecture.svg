      <text x="230" y="522" fill="rgb(86, 96, 126)" fill-opacity="1" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" stroke-opacity="1" opacity="1" font-size="11.5px" font-weight="400" font-family="Inter, Arial, Helvetica, sans-serif">ledger_entries (append-only) · fund_requests · budgets · notifications · messages · audit log</text>
      <text x="230" y="544" fill="rgb(86, 96, 126)" fill-opacity="1" stroke="none" stroke-width="1px" stroke-dasharray="none" stroke-linejoin="miter" stroke-linecap="butt" stroke-opacity="1" opacity="1" font-size="11.5px" font-weight="400" font-family="Inter, Arial, Helvetica, sans-serif">Row Level Security on every table · buckets: logos (public), receipts (private, one folder per org)</text>
