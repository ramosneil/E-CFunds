<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" role="img" aria-label="Sequence for an expense: the treasurer's app uploads the receipt photo to storage, calls file_request which checks available cash and saves it as pending; SAS is notified, approves, and review_request writes the expense to the ledger and the budget; the treasurer is notified and sees cash on hand and the budget's remaining amount drop." xmlns="http://www.w3.org/2000/svg" width="960" height="600">
